id: 8c32bb35-6c13-4fcb-b754-9367d5e90606
name: Entra ID credential added to service principal or application
description: Detects new password credentials or certificates added to an application or service principal, a technique used to establish persistent access.
severity: High
status: Available
kind: Scheduled
version: 1.0.0
owner: Identity Detection Engineering
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
queryFrequency: 15m
queryPeriod: 30m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
relevantTechniques:
  - T1098.001
query: |
  AuditLogs
  | where TimeGenerated > ago(30m)
  | where Category =~ "ApplicationManagement"
  | where OperationName in~ ("Add service principal credentials", "Update application - Certificates and secrets management", "Update service principal")
  | mv-apply TargetResource=TargetResources on (
      extend TargetName=tostring(TargetResource.displayName), TargetId=tostring(TargetResource.id),
          TargetType=tostring(TargetResource.type), ModifiedProperties=TargetResource.modifiedProperties)
  | mv-apply Property=ModifiedProperties on (
      where tostring(Property.displayName) has_any ("KeyDescription", "PasswordCredentials", "KeyCredentials")
      | extend CredentialProperty=tostring(Property.displayName), NewValue=tostring(Property.newValue), OldValue=tostring(Property.oldValue))
  | where isnotempty(NewValue) and NewValue !in ("[]", "null")
  | extend InitiatingUserPrincipalName=tostring(InitiatedBy.user.userPrincipalName),
      InitiatingUserId=tostring(InitiatedBy.user.id), InitiatingApp=tostring(InitiatedBy.app.displayName),
      InitiatingServicePrincipalId=tostring(InitiatedBy.app.servicePrincipalId),
      InitiatingIPAddress=tostring(coalesce(InitiatedBy.user.ipAddress, InitiatedBy.app.ipAddress))
  | project TimeGenerated, OperationName, Result, TargetName, TargetId, TargetType, CredentialProperty,
      InitiatingUserPrincipalName, InitiatingUserId, InitiatingApp, InitiatingServicePrincipalId,
      InitiatingIPAddress, CorrelationId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: InitiatingUserPrincipalName
      - identifier: AadUserId
        columnName: InitiatingUserId
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: InitiatingIPAddress
eventGroupingSettings:
  aggregationKind: AlertPerResult
customDetails:
  TargetApplication: TargetName
  TargetObjectId: TargetId
  CredentialType: CredentialProperty
falsePositives:
  - Authorized application deployment, certificate rotation, or secret rotation.
investigation: Verify the change owner, pipeline, change record, credential lifetime, and source IP. Remove unauthorized credentials, rotate related secrets, and review application permissions and sign-ins.
